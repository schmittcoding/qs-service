[package]
name = "ran-db-core"
edition.workspace = true
version.workspace = true
authors.workspace = true
description.workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
ran-models.workspace = true
tokio.workspace = true
tokio-util = "0.7.17"
tiberius.workspace = true
deadpool-tiberius.workspace = true
serde.workspace = true
dotenvy.workspace = true
futures-util.workspace = true
async-trait.workspace = true
tracing = { version = "0.1.41", features = ["async-await", "log", "attributes"] }
log = { version = "0.4.25", features = ["serde", "std"] }
paypal-rs.workspace = true
uuid.workspace = true
regex = { version = "1.11.1", features = ["logging"] }
anyhow.workspace = true
base64.workspace = true
# Security-related dependencies
secrecy = { version = "0.10.3", features = ["serde"] } # For handling sensitive data
validator = { version = "0.20.0", features = ["derive"] } # For input validation
metrics = "0.24.1" # For performance metrics
metrics-exporter-prometheus = { version = "0.16.2", features = ["http-listener"] } # For exporting metrics
once_cell = "1.18" # For lazy static initialization
thiserror = "2.0.12" # For better error handling
cached = "0.55.1" # For caching frequently used data
serde_json.workspace = true
